  <style>

    *,

    html,
    body {

    body {
      min-height: 100vh;

    @keyframes bookmark-pass {

    @media (max-width: 36rem) {
      body {

    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    (function () {
      function siteBase() {
        var parts = location.pathname.split("/").filter(Boolean);
        var first = parts[0] || "";
        return first && first.indexOf(".") === -1 ? "/" + first + "/" : "/";
      }

      function normalizeWords(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/%[0-9a-f]{2}/gi, " ")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function prettySlug(slug) {
        return String(slug || "")
          .replace(/-/g, " ")
          .replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
      }

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (error) {
          return value;
        }
      }

      function pathSearchSeed() {
        var parts = location.pathname.split("/").filter(Boolean);
        var first = parts[0] || "";
        if (first && first.indexOf(".") === -1) {
          parts.shift();
        }
        return parts
          .join(" ")
          .replace(/\.[a-z0-9]+$/i, "")
          .replace(/\b(old|link|page|html)\b/gi, " ");
      }

      function loadCatalogue() {
        try {
          var node = document.getElementById("recovery-catalogue");
          var parsed = JSON.parse(node ? node.textContent : "{}");
          return Array.isArray(parsed.essays) ? parsed.essays : [];
        } catch (error) {
          return [];
        }
      }

      function findEssay(catalogue, slug) {
        return catalogue.find(function (essay) {
          return essay.slug === slug;
        }) || null;
      }

      function findSection(essay, sectionNumber) {
        if (!essay || !Array.isArray(essay.sections)) {
          return null;
        }
        return essay.sections.find(function (section) {
          return String(section.number) === String(sectionNumber);
        }) || null;
      }

      function nearestSection(essay, sectionNumber) {
        if (!essay || !Array.isArray(essay.sections) || essay.sections.length === 0) {
          return null;
        }
        var parsed = Number.parseInt(String(sectionNumber), 10);
        if (!Number.isFinite(parsed)) {
          return essay.sections[0];
        }
        return essay.sections.reduce(function (best, section) {
          return Math.abs(section.number - parsed) < Math.abs(best.number - parsed) ? section : best;
        }, essay.sections[0]);
      }

      function pathExtension() {
        var clean = location.pathname.split("/").pop() || "";
        var match = clean.match(/\.([a-z0-9]+)$/i);
        return match ? match[1].toLowerCase() : "";
      }

      function classify(params) {
        var slug = (params.get("essay") || "").trim();
        var section = (params.get("section") || "").trim();
        var query = (params.get("q") || params.get("query") || params.get("search") || "").trim();
        var path = location.pathname.toLowerCase();
        var extension = pathExtension();
        if (navigator && navigator.onLine === false) {
          return "offline";
        }
        if (slug && section) {
          return "section";
        }
        if (slug) {
          return "essay";
        }
        if (query || /(^|\/)search([./-]|$)/.test(path)) {
          return "search";
        }
        if (/^(html|txt|png|jpg|jpeg|webp|svg|pdf|xml|json)$/.test(extension)) {
          return "asset";
        }
        return "unknown";
      }

      function applyModeCopy(mode) {
        var copy = {
          unknown: {
            eyebrow: "Missing shelf mark",
            lead: "The address is not in the catalogue. The page may have moved, or the link may have lost a letter on the way here.",
            recovery: "Try a nearby drawer"
          },
          essay: {
            eyebrow: "Misfiled catalogue entry",
            lead: "This essay shelf mark does not open cleanly, but the archive can still look for the nearest entry.",
            recovery: "Possible essay matches"
          },
          section: {
            eyebrow: "Missing folio",
            lead: "The essay may exist, but this folio number is not where the link expected it to be.",
            recovery: "Possible section matches"
          },
          search: {
            eyebrow: "Smudged index card",
            lead: "The search route is not valid anymore, but the terms can still be sent through the archive index.",
            recovery: "Recover the search"
          },
          asset: {
            eyebrow: "Missing enclosure",
            lead: "The requested file is no longer attached to this card. Its name may still point toward the right essay.",
            recovery: "Trace the enclosure"
          },
          offline: {
            eyebrow: "Offline shelf",
            lead: "The network is out. Cached pages may still open, but live search and uncached sections can be incomplete.",
            recovery: "Try the local shelf"
          }
        }[mode] || {};

        document.querySelector(".eyebrow").textContent = copy.eyebrow;
        document.querySelector(".lead").textContent = copy.lead;
        document.getElementById("recovery-title").textContent = copy.recovery;
        document.body.setAttribute("data-recovery-mode", mode);
      }

      function scoreNeedle(needle, haystack) {
        var normalizedNeedle = normalizeWords(needle);
        var normalizedHaystack = normalizeWords(haystack);
        if (!normalizedNeedle || !normalizedHaystack) {
          return 0;
        }
        if (normalizedHaystack.indexOf(normalizedNeedle) !== -1) {
          return normalizedNeedle.length + 20;
        }
        return normalizedNeedle.split(/\s+/).reduce(function (score, word) {
          return score + (word.length > 2 && normalizedHaystack.indexOf(word) !== -1 ? word.length : 0);
        }, 0);
      }

      function appendSuggestion(list, href, label, note) {
        var item = document.createElement("li");
        var link = document.createElement("a");
        var title = document.createElement("span");
        var detail = document.createElement("span");
        item.className = "suggestion";
        title.className = "suggestion-label";
        detail.className = "suggestion-note";
        title.textContent = label;
        detail.textContent = note;
        link.href = href;
        link.append(title, detail);
        item.appendChild(link);
        list.appendChild(item);
      }

      function renderPrimary(href, label, note) {
        var box = document.getElementById("did-you-mean");
        var link = document.createElement("a");
        var title = document.createElement("span");
        var detail = document.createElement("span");
        title.className = "suggestion-label";
        detail.className = "suggestion-note";
        title.textContent = label;
        detail.textContent = note;
        link.href = href;
        link.append(title, detail);
        box.replaceChildren(link);
        box.hidden = false;
      }

      function bestCatalogueMatch(seed) {
        var best = null;
        catalogue.forEach(function (essay) {
          var essayScore = scoreNeedle(seed, essay.slug + " " + essay.title + " " + essay.summary);
          if (essayScore > 0 && (!best || essayScore > best.score)) {
            best = { type: "essay", essay: essay, score: essayScore };
          }
          essay.sections.forEach(function (section) {
            var sectionScore = scoreNeedle(seed, essay.slug + " " + essay.title + " " + section.title);
            if (sectionScore > 0 && (!best || sectionScore > best.score)) {
              best = { type: "section", essay: essay, section: section, score: sectionScore };
            }
          });
        });
        return best;
      }

      var catalogue = loadCatalogue();
      var base = siteBase();
      var params = new URLSearchParams(location.search);
      var archive = document.getElementById("archive-link");
      var search = document.getElementById("search-link");
      var suggestions = document.getElementById("suggestions");
      var queryInput = document.getElementById("notfound-query");
      var missingPath = safeDecode(location.pathname + location.search);
      var mode = classify(params);
      var seed = normalizeWords(
        params.get("q") ||
        params.get("query") ||
        params.get("search") ||
        params.get("essay") ||
        pathSearchSeed()
      );

      archive.href = base + "index.html";
      search.href = base + "search.html";
      document.getElementById("missing-path").textContent = missingPath || "Unknown shelf mark";
      queryInput.value = seed.replace(/\brenaissance\b/g, "").trim();
      applyModeCopy(mode);

      var slug = (params.get("essay") || "").trim();
      var section = (params.get("section") || "").trim();
      var essay = findEssay(catalogue, slug);
      if (mode === "section" && /^[a-z0-9][a-z0-9-]*$/i.test(slug)) {
        var exactSection = findSection(essay, section);
        var fallbackSection = exactSection || nearestSection(essay, section);
        if (essay && fallbackSection) {
          renderPrimary(
            base + fallbackSection.route,
            essay.title + ": " + fallbackSection.title,
            exactSection ? "Exact section from the old link" : "Nearest valid section in this essay"
          );
          appendSuggestion(suggestions, base + essay.route, "Open " + essay.title, "Return to the essay table of contents");
        } else {
          var sectionBest = bestCatalogueMatch(slug + " " + section + " " + seed);
          if (sectionBest && sectionBest.type === "section") {
            renderPrimary(
              base + sectionBest.section.route,
              sectionBest.essay.title + ": " + sectionBest.section.title,
              "Closest section in the catalogue"
            );
          }
        }
      } else if (mode === "essay" && /^[a-z0-9][a-z0-9-]*$/i.test(slug)) {
        if (essay) {
          renderPrimary(
            base + essay.route,
            "Open " + essay.title,
            "Exact essay from the old link"
          );
        } else {
          var essayBest = bestCatalogueMatch(slug);
          if (essayBest) {
            renderPrimary(
              base + (essayBest.type === "section" ? essayBest.section.route : essayBest.essay.route),
              essayBest.type === "section" ? essayBest.essay.title + ": " + essayBest.section.title : essayBest.essay.title,
              "Closest catalogue match"
            );
          }
        }
      } else {
        var best = bestCatalogueMatch(seed);
        if (best && best.type === "section") {
          renderPrimary(
            base + best.section.route,
            best.essay.title + ": " + best.section.title,
            "Closest section in the catalogue"
          );
        } else if (best) {
          renderPrimary(
            base + best.essay.route,
            best.essay.title,
            "Closest essay in the catalogue"
          );
        }
      }

      if (queryInput.value) {
        appendSuggestion(
          suggestions,
          base + "search.html?q=" + encodeURIComponent(queryInput.value),
          "Search for \"" + queryInput.value + "\"",
          mode === "offline" ? "Try this when the network returns" : "Look across every published essay"
        );
      }
      appendSuggestion(
        suggestions,
        base + "index.html",
        mode === "offline" ? "Open cached archive shell" : "Return to the archive",
        mode === "offline" ? "May already be available offline" : "Start from the catalogue"
      );
      appendSuggestion(
        suggestions,
        base + "search.html",
        mode === "offline" ? "Open search shell" : "Open search",
        mode === "offline" ? "Full results may need the network" : "Use the full search page"
      );

      document.getElementById("notfound-search").addEventListener("submit", function (event) {
        event.preventDefault();
        var query = queryInput.value.trim();
        location.href = base + "search.html" + (query ? "?q=" + encodeURIComponent(query) : "");
      });
    })();
  </script>
</body>
</html>
