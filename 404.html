<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found - Renaissance</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("renaissance-theme");
        document.documentElement.setAttribute(
          "data-theme",
          savedTheme === "dark" ? "dark" : "light"
        );
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <!-- Self-contained on purpose: GitHub Pages serves this file for ANY missing
       path depth, so external stylesheet/script links cannot be relied on. -->
  <style>
    :root {
      --paper: #f8f2e7;
      --canvas: #efe5d6;
      --text: #2a2018;
      --muted: #6d5d4a;
      --line: #cdbba3;
      --accent: #a34f2a;
      --accent-hover: #8f4322;
      --accent-ink: #fff7ef;
      --accent-wash: rgba(163, 79, 42, 0.08);
      --font-title: "Garamond", "Palatino Linotype", "Book Antiqua", serif;
      --font-body: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      --font-ui: "Optima", "Gill Sans MT", "Trebuchet MS", sans-serif;
      --motion-fast: 140ms;
      --motion-base: 220ms;
      --motion-ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root[data-theme="dark"] {
      --paper: #211a14;
      --canvas: #18130f;
      --text: #f0e2d1;
      --muted: #b69f84;
      --line: #534233;
      --accent: #c96d3e;
      --accent-hover: #dd8050;
      --accent-ink: #1f160f;
      --accent-wash: rgba(201, 109, 62, 0.14);
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--paper) 88%, #fff 12%), transparent 58%),
        linear-gradient(180deg, color-mix(in srgb, var(--canvas) 86%, var(--paper) 14%), var(--canvas));
      color: var(--text);
      font-family: var(--font-body);
    }
    a {
      color: inherit;
    }
    .notfound-shell {
      width: min(44rem, 100%);
    }
    .notfound-rule {
      position: relative;
      height: 0.72rem;
      margin: 0 0 1.1rem;
      border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .notfound-rule::after {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      width: 5.8rem;
      height: 1px;
      background: var(--accent);
      animation: bookmark-pass 900ms var(--motion-ease) both;
    }
    .notfound-card {
      position: relative;
      padding: 0.6rem 0 0;
    }
    .notfound-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0.2rem;
      width: 1.4rem;
      height: 0.22rem;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, calc(100% - 0.18rem) 100%, 0.12rem 100%);
    }
    .eyebrow {
      margin: 0 0 0.58rem;
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0;
      max-width: 32rem;
      font-family: var(--font-title);
      font-weight: 500;
      font-size: clamp(2rem, 6vw, 3.1rem);
      line-height: 1.04;
      letter-spacing: 0.01em;
    }
    .lead {
      max-width: 32rem;
      margin: 0.82rem 0 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.58;
    }
    .shelf-mark {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 1rem 0 0;
      border: 1px solid color-mix(in srgb, var(--line) 84%, var(--accent) 16%);
      border-radius: 4px 2px 4px 2px;
      background: color-mix(in srgb, var(--paper) 88%, var(--canvas) 12%);
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      padding: 0.36rem 0.5rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .shelf-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 0%, color-mix(in srgb, var(--accent) 16%, transparent) 45%, transparent 70%);
      transform: translateX(-110%);
      animation: shelf-glint 1300ms 260ms var(--motion-ease) both;
      pointer-events: none;
    }
    .recovery-panel {
      margin: 1.25rem 0 0;
      border-top: 1px solid var(--line);
      padding-top: 0.78rem;
    }
    .recovery-title {
      margin: 0 0 0.54rem;
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
    }
    .did-you-mean {
      margin: 0 0 0.58rem;
    }
    .suggestions {
      display: grid;
      gap: 0.36rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .suggestion {
      opacity: 0;
      transform: translateY(0.24rem);
      animation: suggestion-in 280ms var(--motion-ease) both;
    }
    .suggestion:nth-child(2) {
      animation-delay: 80ms;
    }
    .suggestion:nth-child(3) {
      animation-delay: 150ms;
    }
    .suggestion a,
    .did-you-mean a {
      display: grid;
      gap: 0.08rem;
      border: 1px solid color-mix(in srgb, var(--line) 88%, var(--accent) 12%);
      border-radius: 5px 2px 5px 2px;
      background: color-mix(in srgb, var(--paper) 91%, var(--canvas) 9%);
      padding: 0.54rem 0.64rem;
      text-decoration: none;
      transition:
        background-color var(--motion-fast) var(--motion-ease),
        border-color var(--motion-fast) var(--motion-ease),
        color var(--motion-fast) var(--motion-ease);
    }
    .suggestion a:hover,
    .did-you-mean a:hover {
      border-color: var(--accent);
      background: var(--accent-wash);
      color: var(--accent);
    }
    .suggestion-label {
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.3;
    }
    .suggestion-note {
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
    }
    .notfound-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.46rem;
      align-items: center;
      margin: 0.72rem 0 0;
      max-width: 32rem;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    input[type="search"] {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: color-mix(in srgb, var(--paper) 96%, transparent);
      color: var(--text);
      font: inherit;
      padding: 0.48rem 0.6rem;
    }
    .notfound-search button {
      align-self: center;
      min-height: 1.68rem;
      border: 1px solid color-mix(in srgb, var(--accent-hover) 74%, #2a2018 26%);
      border-radius: 2px;
      background:
        linear-gradient(90deg, rgba(255, 247, 239, 0.2), transparent 42%),
        linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 82%, #4a2b1d 18%),
          color-mix(in srgb, var(--accent-hover) 78%, #24170f 22%)
        );
      box-shadow: 0 1px 0 rgba(255, 247, 239, 0.18) inset, 0 2px 0 rgba(24, 14, 8, 0.16);
      clip-path: polygon(0.28rem 0, 100% 0, calc(100% - 0.28rem) 100%, 0 100%);
      color: var(--accent-ink);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.74rem;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.58rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.48rem;
      margin: 0.78rem 0 0;
    }
    .actions a {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 4px 2px 4px 2px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      padding: 0.38rem 0.62rem;
      text-decoration: none;
      transition:
        background-color var(--motion-fast) var(--motion-ease),
        border-color var(--motion-fast) var(--motion-ease),
        color var(--motion-fast) var(--motion-ease);
    }
    .actions a:hover {
      border-color: var(--accent);
      background: var(--accent-wash);
      color: var(--accent);
    }
    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @keyframes bookmark-pass {
      from {
        transform: translateX(-6rem);
      }
      to {
        transform: translateX(0);
      }
    }
    @keyframes shelf-glint {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(110%);
      }
    }
    @keyframes suggestion-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 36rem) {
      body {
        place-items: start center;
        padding-top: 2.4rem;
      }
      .notfound-search {
        grid-template-columns: 1fr;
      }
      .notfound-search button {
        justify-self: start;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="notfound-shell">
    <div class="notfound-rule" aria-hidden="true"></div>
    <section class="notfound-card" aria-labelledby="notfound-title">
      <p class="eyebrow">Missing shelf mark</p>
      <h1 id="notfound-title">This page slipped out of the archive.</h1>
      <p class="lead">
        The address is not in the catalogue. The page may have moved, or the link
        may have lost a letter on the way here.
      </p>
      <p class="shelf-mark" id="missing-path"></p>

      <section class="recovery-panel" aria-labelledby="recovery-title">
        <p class="recovery-title" id="recovery-title">Try a nearby drawer</p>
        <p class="did-you-mean" id="did-you-mean" hidden></p>
        <ul class="suggestions" id="suggestions"></ul>
        <form class="notfound-search" id="notfound-search" role="search">
          <label class="sr-only" for="notfound-query">Search the archive</label>
          <input id="notfound-query" name="q" type="search" placeholder="Search the essays" autocomplete="off">
          <button type="submit">Search</button>
        </form>
        <p class="actions">
          <a id="archive-link" href="index.html">Return to archive</a>
          <a id="search-link" href="search.html">Open search</a>
        </p>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var catalogue = [
        {
          slug: "etching-god-into-sand",
          title: "Etching God into Sand",
          summary: "Sand, silicon, language, and cognition.",
          sections: [
            { number: 1, title: "The Oldest Material" },
            { number: 2, title: "Nine Nines" },
            { number: 3, title: "The Amber Twilight" },
            { number: 4, title: "Emet" },
            { number: 5, title: "Every Possible Book" },
            { number: 6, title: "Unmixed Attention" },
            { number: 7, title: "The Omega Point" },
            { number: 8, title: "A World in a Grain" },
            { number: 9, title: "While You Were Arguing" },
            { number: 10, title: "The Roof Is Open" }
          ]
        }
      ];

      function siteBase() {
        var parts = location.pathname.split("/").filter(Boolean);
        var first = parts[0] || "";
        return first && first.indexOf(".") === -1 ? "/" + first + "/" : "/";
      }

      function normalizeWords(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/%[0-9a-f]{2}/gi, " ")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function prettySlug(slug) {
        return String(slug || "")
          .replace(/-/g, " ")
          .replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
      }

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (error) {
          return value;
        }
      }

      function pathSearchSeed() {
        var parts = location.pathname.split("/").filter(Boolean);
        var first = parts[0] || "";
        if (first && first.indexOf(".") === -1) {
          parts.shift();
        }
        return parts
          .join(" ")
          .replace(/\.[a-z0-9]+$/i, "")
          .replace(/\b(old|link|page|html)\b/gi, " ");
      }

      function scoreNeedle(needle, haystack) {
        var normalizedNeedle = normalizeWords(needle);
        var normalizedHaystack = normalizeWords(haystack);
        if (!normalizedNeedle || !normalizedHaystack) {
          return 0;
        }
        if (normalizedHaystack.indexOf(normalizedNeedle) !== -1) {
          return normalizedNeedle.length + 20;
        }
        return normalizedNeedle.split(/\s+/).reduce(function (score, word) {
          return score + (word.length > 2 && normalizedHaystack.indexOf(word) !== -1 ? word.length : 0);
        }, 0);
      }

      function appendSuggestion(list, href, label, note) {
        var item = document.createElement("li");
        var link = document.createElement("a");
        var title = document.createElement("span");
        var detail = document.createElement("span");
        item.className = "suggestion";
        title.className = "suggestion-label";
        detail.className = "suggestion-note";
        title.textContent = label;
        detail.textContent = note;
        link.href = href;
        link.append(title, detail);
        item.appendChild(link);
        list.appendChild(item);
      }

      function renderPrimary(href, label, note) {
        var box = document.getElementById("did-you-mean");
        var link = document.createElement("a");
        var title = document.createElement("span");
        var detail = document.createElement("span");
        title.className = "suggestion-label";
        detail.className = "suggestion-note";
        title.textContent = label;
        detail.textContent = note;
        link.href = href;
        link.append(title, detail);
        box.replaceChildren(link);
        box.hidden = false;
      }

      function bestCatalogueMatch(seed) {
        var best = null;
        catalogue.forEach(function (essay) {
          var essayScore = scoreNeedle(seed, essay.slug + " " + essay.title + " " + essay.summary);
          if (essayScore > 0 && (!best || essayScore > best.score)) {
            best = { type: "essay", essay: essay, score: essayScore };
          }
          essay.sections.forEach(function (section) {
            var sectionScore = scoreNeedle(seed, essay.slug + " " + essay.title + " " + section.title);
            if (sectionScore > 0 && (!best || sectionScore > best.score)) {
              best = { type: "section", essay: essay, section: section, score: sectionScore };
            }
          });
        });
        return best;
      }

      var base = siteBase();
      var params = new URLSearchParams(location.search);
      var archive = document.getElementById("archive-link");
      var search = document.getElementById("search-link");
      var suggestions = document.getElementById("suggestions");
      var queryInput = document.getElementById("notfound-query");
      var missingPath = safeDecode(location.pathname + location.search);
      var seed = normalizeWords(
        params.get("q") ||
        params.get("search") ||
        params.get("essay") ||
        pathSearchSeed()
      );

      archive.href = base + "index.html";
      search.href = base + "search.html";
      document.getElementById("missing-path").textContent = missingPath || "Unknown shelf mark";
      queryInput.value = seed.replace(/\brenaissance\b/g, "").trim();

      var slug = (params.get("essay") || "").trim();
      var section = (params.get("section") || "").trim();
      if (/^[a-z0-9][a-z0-9-]*$/i.test(slug)) {
        if (/^\d+$/.test(section)) {
          renderPrimary(
            base + "section.html?essay=" + encodeURIComponent(slug) + "&section=" + encodeURIComponent(section),
            "Open " + prettySlug(slug) + ", section " + section,
            "Closest match from the old section link"
          );
        } else {
          renderPrimary(
            base + "essay.html?essay=" + encodeURIComponent(slug),
            "Open " + prettySlug(slug),
            "Closest match from the old essay link"
          );
        }
      } else {
        var best = bestCatalogueMatch(seed);
        if (best && best.type === "section") {
          renderPrimary(
            base + "section.html?essay=" + encodeURIComponent(best.essay.slug) + "&section=" + String(best.section.number),
            best.essay.title + ": " + best.section.title,
            "Closest section in the catalogue"
          );
        } else if (best) {
          renderPrimary(
            base + "essay.html?essay=" + encodeURIComponent(best.essay.slug),
            best.essay.title,
            "Closest essay in the catalogue"
          );
        }
      }

      if (queryInput.value) {
        appendSuggestion(
          suggestions,
          base + "search.html?q=" + encodeURIComponent(queryInput.value),
          "Search for \"" + queryInput.value + "\"",
          "Look across every published essay"
        );
      }
      appendSuggestion(suggestions, base + "index.html", "Return to the archive", "Start from the catalogue");
      appendSuggestion(suggestions, base + "search.html", "Open search", "Use the full search page");

      document.getElementById("notfound-search").addEventListener("submit", function (event) {
        event.preventDefault();
        var query = queryInput.value.trim();
        location.href = base + "search.html" + (query ? "?q=" + encodeURIComponent(query) : "");
      });
    })();
  </script>
</body>
</html>
