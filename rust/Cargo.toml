[package]
name = "scriptorium-parser"
version = "0.2.0"
edition = "2021"
description = "Crate-free Rust port of the Renaissance AST parser, oracle-validated byte-identical against scripts/ast/parse.js (docs/specs/SCRIPTORIUM-RUST-PARSER.md)."

# ZERO third-party dependencies — std only (SCRIPTORIUM-RUST-PARSER.md §7).
# Do not add a [dependencies] section. No serde, no regex, no wasm-bindgen.

[features]
# `smoke` gates the windowed lifecycle smoke test for the native editor: it spins up
# a real window, pumps synthetic WM_CHAR/WM_KEYDOWN, forces a paint, and destroys the
# window. It's #[ignore]'d and Windows-only, and opt-in so a blind-write regression in
# this OS-driving test can't break the main gate. CI runs it informationally:
#   cargo test --features smoke -- --ignored
smoke = []

[lib]
name = "scriptorium_parser"
path = "src/lib.rs"
# cdylib → the .wasm the browser editor loads (R1); rlib → the native bin + tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scriptorium-parser"
path = "src/main.rs"

# The native author server (R2) — std-only HTTP, the Node-killer.
[[bin]]
name = "scriptorium-server"
path = "src/bin/server.rs"

# The build-time content compiler (Pass 1 step 2) — emits data/compiled/<slug>.json
# byte-identical to generate-content-ast.js, with zero parse.js in the build path.
[[bin]]
name = "scriptorium-content-ast"
path = "src/bin/content-ast.rs"

# The build-time search index (Pass 1 step 3) — emits data/search-index.json
# byte-identical to generate-search-index.js.
[[bin]]
name = "scriptorium-search-index"
path = "src/bin/search-index.rs"

# The native desktop editor (N0 walking skeleton) — a co-located bin module tree
# (SCRIPTORIUM-NATIVE-SKELETON.md). Windows-only GUI; a #[cfg(not(windows))] stub
# main keeps the workspace green on Linux/macOS CI. Reuses the parser in-process
# (the UTF-16 buffer feeds parse_document(&[u16]) with zero conversion). No new crate.
[[bin]]
name = "scriptorium-native-editor"
path = "src/bin/native-editor/main.rs"

[profile.release]
opt-level = 2
# Abort on panic — no unwinding tables, and a clean import-free wasm module.
panic = "abort"
