<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scriptorium — wasm parity harness</title>
  <!-- Loads the wasm parser so a Playwright test can parse inputs IN A REAL
       BROWSER and compare the result to the committed golden snapshot
       (SCRIPTORIUM-RUST-PARSER.md §14.3; closes SCRIPTORIUM.md §12 blocker 1:
       browser modules vs Node). After the parse.js cutover there is no
       browser-JS parser to load — the wasm is the one parser. Not shipped. -->
  <script src="wasm-parser.js" defer></script>
</head>
<body>
  <p id="status">loading…</p>
  <script>
    // Runs after the deferred scripts have executed.
    document.addEventListener("DOMContentLoaded", function () {
      var status = document.getElementById("status");
      if (!window.ScriptoriumWasmParser) {
        window.__parityError = "ScriptoriumWasmParser missing";
        status.textContent = window.__parityError;
        return;
      }
      window.ScriptoriumWasmParser.load("scriptorium_parser.wasm").then(function () {
        window.__parityReady = true;
        status.textContent = "ready";
      }).catch(function (err) {
        window.__parityError = "wasm load failed: " + (err && err.message ? err.message : String(err));
        status.textContent = window.__parityError;
      });
    });
  </script>
</body>
</html>
