<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Scriptorium — Renaissance authoring</title>
  <link rel="stylesheet" href="editor.css">
  <!-- Installable PWA (local only): the editor can be installed as a standalone
       desktop window with zero dependencies — just a manifest + a /scriptorium/
       -scoped service worker (quarantine §6: isolated from the site's own SW). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#a34f2a">
  <!--
    THE SPINE (SCRIPTORIUM.md §2): author through the ONE parse authority.
    core.js  -> the shared AST surface + normalizeAstInput (no parser of its own)
    render.js -> the real consume-side DOM renderer the deploy uses
    parse.js  -> registers the string parser into core; allowed here because this
                 is local author tooling, NOT the shipped site (quarantine §6
                 forbids the site importing scriptorium, not the reverse).
    These are the site's OWN modules. There is no editor-private parser.
  -->
  <script src="../scripts/ast/core.js" defer></script>
  <script src="../scripts/ast/render.js" defer></script>
  <script src="../scripts/ast/parse.js" defer></script>
  <!-- Structural layer (SCRIPTORIUM-EDITOR.md): pure offset↔block mapping +
       AST-aware command functions (oracle-verified). Local author tooling,
       requireable in Node for tests; neither forks the parser. -->
  <script src="mapping.js" defer></script>
  <script src="commands.js" defer></script>
  <script src="editor.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <span class="app-title">Scriptorium</span>
      <span class="app-sub">local authoring · Renaissance</span>
    </div>
    <div class="picker" role="group" aria-label="Section picker">
      <label class="field">
        <span class="field-label">Essay</span>
        <select id="essay-select" aria-label="Choose essay">
          <option value="">Loading…</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">Section</span>
        <select id="section-select" aria-label="Choose section" disabled>
          <option value="">—</option>
        </select>
      </label>
      <button id="save-button" class="button button-primary" type="button" disabled>Save</button>
      <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="workbench">
    <section class="pane pane-edit" aria-label="Editor">
      <div class="pane-head">
        <span class="pane-title">Source</span>
        <span id="doc-stats" class="pane-note muted" aria-live="polite"></span>
      </div>
      <!-- Formatting commands (SCRIPTORIUM-EDITOR.md §5). Each button runs an
           AST-aware command verified through the one parser before it commits;
           editor.js binds clicks + keys by data-cmd. Hidden if commands.js
           didn't load. -->
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting commands" hidden>
        <button class="tool" type="button" data-cmd="strong" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
        <button class="tool" type="button" data-cmd="emphasis" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
        <button class="tool tool-mono" type="button" data-cmd="code" title="Code (Ctrl/Cmd+`)">&lt;/&gt;</button>
        <button class="tool" type="button" data-cmd="link" title="Link (Ctrl/Cmd+K)">link</button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button class="tool" type="button" data-cmd="heading-1" title="Heading 1 (Ctrl/Cmd+Alt+1)">H1</button>
        <button class="tool" type="button" data-cmd="heading-2" title="Heading 2 (Ctrl/Cmd+Alt+2)">H2</button>
        <button class="tool" type="button" data-cmd="heading-3" title="Heading 3 (Ctrl/Cmd+Alt+3)">H3</button>
        <button class="tool" type="button" data-cmd="heading-0" title="Body text (Ctrl/Cmd+Alt+0)">&para;</button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button class="tool" type="button" data-cmd="pull-quote" title="Pull-quote (Ctrl/Cmd+Alt+Q)">PQ</button>
        <button class="tool" type="button" data-cmd="blockquote" title="Blockquote (Ctrl/Cmd+Alt+B)">&rsaquo;</button>
        <button class="tool" type="button" data-cmd="divider" title="Divider (Ctrl/Cmd+Alt+H)">&mdash;</button>
      </div>
      <textarea
        id="editor"
        class="editor-textarea"
        spellcheck="true"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        wrap="soft"
        aria-label="Section source text"
        placeholder="Choose an essay and section to begin, or start typing…"
      ></textarea>
    </section>

    <section class="pane pane-preview" aria-label="Live preview">
      <div class="pane-head">
        <span class="pane-title">Preview</span>
        <span class="pane-note muted">render(parse(buffer)) · the shipped DOM</span>
      </div>
      <article id="preview" class="preview chapter-content" aria-live="polite"></article>
    </section>

    <aside class="pane pane-side" aria-label="Workbench">
      <div class="side-block">
        <div class="pane-head">
          <span class="pane-title">Diagnostics</span>
          <span id="diag-count" class="badge" aria-live="polite">0</span>
        </div>
        <ul id="diagnostics" class="diagnostics" aria-live="polite">
          <li class="diag-empty muted">Clean — no diagnostics.</li>
        </ul>
      </div>

      <div class="side-block">
        <div class="pane-head">
          <span class="pane-title">Outline</span>
        </div>
        <ul id="outline" class="outline" aria-label="Heading outline">
          <li class="outline-empty muted">No headings.</li>
        </ul>
      </div>
    </aside>
  </main>

  <!-- Register the scoped service worker so the editor is installable and
       loads offline. Failure is silent — the editor works without it. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function registerScriptoriumSW() {
        navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function ignore() {});
      });
    }
  </script>
</body>
</html>
