name: Deploy (Pages, derive-at-deploy)

# Derive-at-deploy pipeline (AST compiler P4 + P5 net-off). The derived
# artifacts are not committed (see docs/specs/AST-COMPILER.md → Net-off): one
# human source of truth (raw/ + data/essays.json) is rebuilt into every artifact
# here and published through GitHub Actions Pages.
#
# This is the active deploy for `main`. Every push rebuilds and republishes.
# `ci:build-verify` fails closed if the build is non-deterministic or if a
# committed in-place file (sw.js / 404.html) is stale, so the deploy never
# publishes something no test saw; GitHub Pages keeps serving the last good
# deploy until a clean build succeeds (stale-but-working, never broken).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build & verify derived artifacts (deterministic, in-place fresh)
        # Builds every artifact from source and fails closed unless the build is
        # deterministic (built twice, byte-identical) and the committed in-place
        # files (sw.js, 404.html) are fresh. Leaves the artifacts on disk for the
        # staging step below. Net-off: the wholly-generated artifacts are
        # gitignored, so a plain `git diff` no longer covers them — this does.
        run: npm run ci:build-verify

      - name: Configure Pages (enable GitHub Actions as the Pages source)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the served site
        # The site is served from the repo root (no build output dir), so the
        # deployable is the working tree minus VCS, CI, dev tooling, and QA
        # runtime noise that the live site never references.
        run: |
          rsync -a --delete \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'qa' \
            --exclude 'tmp' \
            --exclude 'exports' \
            --exclude '.lighthouseci' \
            --exclude '.npm-cache' \
            --exclude '.chrome-test*' \
            ./ ./_site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
