name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Static Validation and Standalone Regressions
        run: npm run ci:standalone

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Regression Suite
        run: npm run ci:regression

      - name: Subpath Regression Suite (served under /renaissance/)
        run: npm run ci:subpath

      - name: Custom 404 Regression
        run: npm run ci:notfound

      - name: Accessibility Audit (axe-core, light + dark)
        run: npm run ci:a11y

      - name: Offline / PWA Regression (service worker)
        run: npm run ci:offline

      - name: Focus & Keyboard Regression (skip link, focus management)
        run: npm run ci:focus

      - name: Device Matrix Regression (emulated phones/tablet/desktop)
        run: npm run ci:devices

      - name: Keyboard-only Journey Regression
        run: npm run ci:keyboard

      - name: Slow-3G Journey Regression
        run: npm run ci:slow-network

      - name: Service Worker Update-Flow Regression
        run: npm run ci:sw-update

      - name: Visual QA Check (warning-only)
        run: |
          if ! npm run ci:visual; then
            echo "::warning title=Visual QA check failed::Unable to run screenshot capture/diff workflow"
          fi

      - name: Upload Visual QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          if-no-files-found: warn
          path: |
            qa/visual/current/**
            qa/visual/diff/**
            qa/visual/report.json
            qa/visual/report.md

      - name: Lighthouse (warning-only)
        env:
          LIGHTHOUSE_WARN_THRESHOLD: "90"
        run: |
          if ! npm run ci:lighthouse; then
            echo "::warning title=Lighthouse check failed::Unable to run Lighthouse warning workflow"
          fi

      - name: Upload Lighthouse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          if-no-files-found: warn
          # .lighthouseci starts with a dot; v4 skips hidden paths by default.
          include-hidden-files: true
          path: .lighthouseci/**

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    env:
      RENAISSANCE_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Core Reader Journey (${{ matrix.browser }})
        run: npm run ci:crossbrowser -- --browsers ${{ matrix.browser }}

      - name: Subpath Regression (${{ matrix.browser }})
        run: npm run ci:subpath

      - name: Custom 404 Regression (${{ matrix.browser }})
        run: npm run ci:notfound
