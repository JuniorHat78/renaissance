name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Static Validation and Standalone Regressions
        run: npm run ci:standalone

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Regression Suite
        run: npm run ci:regression

      - name: Subpath Regression Suite (served under /renaissance/)
        run: npm run ci:subpath

      - name: Custom 404 Regression
        run: npm run ci:notfound

      - name: Visual QA Check (warning-only)
        run: |
          if ! npm run ci:visual; then
            echo "::warning title=Visual QA check failed::Unable to run screenshot capture/diff workflow"
          fi

      - name: Upload Visual QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-report
          if-no-files-found: warn
          path: |
            qa/visual/current/**
            qa/visual/diff/**
            qa/visual/report.json
            qa/visual/report.md

      - name: Lighthouse (warning-only)
        env:
          LIGHTHOUSE_WARN_THRESHOLD: "90"
        run: |
          if ! npm run ci:lighthouse; then
            echo "::warning title=Lighthouse check failed::Unable to run Lighthouse warning workflow"
          fi

      - name: Upload Lighthouse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          if-no-files-found: warn
          path: .lighthouseci/**
