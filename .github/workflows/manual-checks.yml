name: Manual Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Whitelisted check suite to run on the selected ref."
        required: true
        default: standalone
        type: choice
        options:
          - check
          - html
          - standalone
          - transition-evidence
          - spotlight
          - browser
          - pwa
          - a11y
          - devices
          - visual
          - lighthouse
          - full-chromium

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: >-
          ${{ github.event_name == 'pull_request' ||
              inputs.suite == 'browser' ||
              inputs.suite == 'transition-evidence' ||
              inputs.suite == 'spotlight' ||
              inputs.suite == 'pwa' ||
              inputs.suite == 'a11y' ||
              inputs.suite == 'devices' ||
              inputs.suite == 'visual' ||
              inputs.suite == 'lighthouse' ||
              inputs.suite == 'full-chromium' }}
        run: npx playwright install --with-deps chromium

      - name: Run Selected Suite
        shell: bash
        run: |
          case "${{ inputs.suite || 'full-chromium' }}" in
            check)
              npm run check
              ;;
            html)
              npm run test:html
              ;;
            standalone)
              npm run ci:standalone
              ;;
            transition-evidence)
              npm run ci:transition-evidence
              ;;
            spotlight)
              npm run ci:spotlight
              ;;
            browser)
              npm run ci:regression
              npm run ci:page-transitions
              npm run ci:subpath
              npm run ci:notfound
              npm run ci:passage-alignment
              npm run ci:continuity
              ;;
            pwa)
              npm run ci:offline
              npm run ci:sw-update
              ;;
            a11y)
              npm run ci:a11y
              npm run ci:focus
              npm run ci:keyboard
              ;;
            devices)
              npm run ci:devices
              npm run ci:slow-network
              ;;
            visual)
              npm run ci:visual
              ;;
            lighthouse)
              npm run ci:lighthouse
              ;;
            full-chromium)
              # Run every suite and aggregate failures so one run is a complete
              # damage report, instead of set -e aborting at the first failure.
              fail=0
              failed=""
              for suite in \
                ci:standalone ci:transition-evidence ci:spotlight ci:regression \
                ci:page-transitions ci:subpath ci:notfound ci:passage-alignment \
                ci:continuity ci:a11y ci:offline ci:focus ci:devices \
                ci:keyboard ci:slow-network ci:sw-update ci:visual ci:lighthouse; do
                echo "::group::$suite"
                if npm run "$suite"; then
                  echo "PASS $suite"
                else
                  echo "FAIL $suite"
                  fail=1
                  failed="$failed $suite"
                fi
                echo "::endgroup::"
              done
              if [ "$fail" != "0" ]; then
                echo "::error::Full-chromium failing suites:$failed"
                exit 1
              fi
              echo "All full-chromium suites passed."
              ;;
            *)
              echo "Unknown suite: ${{ inputs.suite }}" >&2
              exit 64
              ;;
          esac

      - name: Upload Visual QA Artifacts
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.suite == 'visual' || inputs.suite == 'full-chromium') }}
        uses: actions/upload-artifact@v7
        with:
          name: manual-visual-qa-${{ inputs.suite || 'full-chromium' }}
          if-no-files-found: warn
          path: |
            qa/visual/current/**
            qa/visual/diff/**
            qa/visual/report.json
            qa/visual/report.md

      - name: Upload Transition Evidence Artifacts
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.suite == 'transition-evidence' || inputs.suite == 'full-chromium') }}
        uses: actions/upload-artifact@v7
        with:
          name: manual-transition-evidence-${{ inputs.suite || 'full-chromium' }}
          if-no-files-found: warn
          path: qa/transition-evidence/**

      - name: Upload Spotlight Artifacts
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.suite == 'spotlight' || inputs.suite == 'full-chromium') }}
        uses: actions/upload-artifact@v7
        with:
          name: manual-spotlight-${{ inputs.suite || 'full-chromium' }}
          if-no-files-found: warn
          path: qa/spotlight/**

      - name: Upload Lighthouse Artifacts
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.suite == 'lighthouse' || inputs.suite == 'full-chromium') }}
        uses: actions/upload-artifact@v7
        with:
          name: manual-lighthouse-${{ inputs.suite || 'full-chromium' }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .lighthouseci/**
