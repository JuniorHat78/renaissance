name: scriptorium-quarantine

# Proves the §6 quarantine the hard way: build the shared Rust core (rust/),
# delete the editor app (scriptorium/) entirely, then run the real deploy build.
# If build:artifacts still succeeds, the shipped site depends only on the Rust
# core + scripts/, never the author tooling — the one-way arrow holds. After the
# parse.js cutover the build's parser IS the Rust core (wasm), which lives at the
# top-level rust/ precisely so this still holds; scriptorium/ is just the editor
# web app on top. This is the enforcer SCRIPTORIUM.md §12 asked for.
#
# Deterministic correctness gate → allowed to hard-fail.

on:
  push:
    branches: [main, feat/scriptorium]
    paths:
      - "scriptorium/**"
      - "scripts/**"
      - "*.html"
      - "sw.js"
      - "package.json"
      - ".github/workflows/scriptorium-quarantine.yml"
  pull_request:
    paths:
      - "scriptorium/**"
      - "scripts/**"
      - "*.html"
      - "sw.js"
      - "package.json"
      - ".github/workflows/scriptorium-quarantine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-without-scriptorium:
    name: build:artifacts with scriptorium/ deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build the native Rust generators (the deploy's artifact builders)
        # rust/ is the shared core, NOT author tooling — it survives the deletion
        # below. The build generates data/compiled + search-index via these native
        # bins after the cutover, exactly as the deploy does. They parse internally
        # (Rust), so the build needs neither scriptorium/ nor a JS parser.
        run: npm run build:rust-bins

      - name: Delete the author tooling (the editor app)
        run: rm -rf scriptorium

      - name: Build the shipped artifacts without it
        run: npm run build:artifacts

      - name: Quarantine holds
        run: echo "build:artifacts succeeded with scriptorium/ deleted — the shipped site depends only on the Rust core + scripts/, never the author tooling."
