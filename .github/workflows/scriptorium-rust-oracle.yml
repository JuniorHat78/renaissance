name: scriptorium-rust-oracle

# The equivalence oracle for the crate-free Rust parser
# (docs/specs/SCRIPTORIUM-RUST-PARSER.md §6): build the parser and assert it is
# byte-identical (structurally) to the ONE JS parse authority over the corpus +
# an adversarial set + seeded fuzz. This is a DETERMINISTIC-CORRECTNESS gate, so
# it is allowed to hard-fail (unlike the project's advisory metric jobs).
#
# The OS matrix is deliberate: the same source compiled on three platforms must
# produce identical ASTs, which also proves native-vs-native determinism for free
# (§10). Quarantine is unaffected — this lives in .github and only ever builds
# scriptorium/rust against scripts/ast; nothing ships.

on:
  push:
    branches: [main, feat/scriptorium]
    paths:
      - "scriptorium/rust/**"
      - "scriptorium/wasm-parser.js"
      - "scriptorium/server.js"
      - "scripts/ast/**"
      - "scripts/tests/rust-parser-oracle.js"
      - "scripts/tests/rust-wasm-oracle.js"
      - "scripts/tests/rust-json-roundtrip.js"
      - "scripts/tests/rust-server-oracle.js"
      - "scripts/tests/scriptorium-wasm-browser-parity.js"
      - "scriptorium/wasm-parity.html"
      - "scripts/tests/lib/parser-oracle-corpus.js"
      - ".github/workflows/scriptorium-rust-oracle.yml"
  pull_request:
    paths:
      - "scriptorium/rust/**"
      - "scriptorium/wasm-parser.js"
      - "scriptorium/server.js"
      - "scripts/ast/**"
      - "scripts/tests/rust-parser-oracle.js"
      - "scripts/tests/rust-wasm-oracle.js"
      - "scripts/tests/rust-json-roundtrip.js"
      - "scripts/tests/rust-server-oracle.js"
      - "scripts/tests/scriptorium-wasm-browser-parity.js"
      - "scriptorium/wasm-parity.html"
      - "scripts/tests/lib/parser-oracle-corpus.js"
      - ".github/workflows/scriptorium-rust-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the parser (release)
        run: npm run build:rust

      - name: Run the equivalence oracle
        run: npm run oracle:rust

  wasm-oracle:
    name: wasm oracle (the artifact the editor loads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: wasm-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: wasm-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The .wasm is the parser the browser editor loads (R1). Build it, then run
      # the same equivalence oracle against it via Node (which runs wasm natively)
      # — proving the shipped artifact is byte-identical to the JS authority.
      - name: Build lib for wasm32-unknown-unknown
        run: npm run build:rust-wasm

      - name: Run the wasm equivalence oracle
        run: npm run oracle:rust-wasm

      - name: Run the JSON round-trip oracle (json_value ≡ JSON.stringify)
        run: npm run oracle:rust-json

  server-oracle:
    name: server oracle (rust ≡ node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the native server
        run: npm run build:rust-server

      - name: Run the differential server oracle (rust vs node)
        env:
          SCRIPTORIUM_SERVER_BIN: scriptorium/rust/target/release/scriptorium-server
        run: npm run oracle:rust-server

  browser-parity:
    name: wasm parity in a real browser (R1 last mile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build + stage the wasm next to the editor
        run: npm run wasm:editor

      - name: Browser parity (browser-JS ≡ wasm-in-browser ≡ Node-JS)
        run: npm run ci:scriptorium-parity
