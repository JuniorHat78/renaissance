name: scriptorium-rust-oracle

# Maximal equivalence CI for the crate-free Rust core (SCRIPTORIUM-RUST-PARSER.md
# §6). parse / render / consume / json / server are each held byte-identical (or
# behaviourally identical) to the JS authority, across an OS × toolchain matrix,
# with heavy seeded fuzz and three-engine in-browser parity. These are
# DETERMINISTIC-CORRECTNESS gates (allowed to hard-fail); the hygiene + size jobs
# are informative (continue-on-error), per the project's CI philosophy.

on:
  push:
    branches: [main, feat/scriptorium]
    paths:
      - "scriptorium/rust/**"
      - "scriptorium/wasm-parser.js"
      - "scriptorium/server.js"
      - "scriptorium/wasm-parity.html"
      - "scripts/ast/**"
      - "scripts/tests/rust-parser-oracle.js"
      - "scripts/tests/rust-wasm-oracle.js"
      - "scripts/tests/rust-json-roundtrip.js"
      - "scripts/tests/rust-render-oracle.js"
      - "scripts/tests/rust-consume-oracle.js"
      - "scripts/tests/rust-server-oracle.js"
      - "scripts/tests/scriptorium-wasm-browser-parity.js"
      - "scripts/tests/lib/parser-oracle-corpus.js"
      - "scripts/tests/rust-content-ast-oracle.js"
      - "scripts/generate-content-ast.js"
      - "scripts/generate-search-index.js"
      - "data/essays.json"
      - "data/compiled/**"
      - "data/search-index.json"
      - "raw/**"
      - ".github/workflows/scriptorium-rust-oracle.yml"
  pull_request:
    paths:
      - "scriptorium/rust/**"
      - "scriptorium/wasm-parser.js"
      - "scriptorium/server.js"
      - "scriptorium/wasm-parity.html"
      - "scripts/ast/**"
      - "scripts/tests/rust-parser-oracle.js"
      - "scripts/tests/rust-wasm-oracle.js"
      - "scripts/tests/rust-json-roundtrip.js"
      - "scripts/tests/rust-render-oracle.js"
      - "scripts/tests/rust-consume-oracle.js"
      - "scripts/tests/rust-server-oracle.js"
      - "scripts/tests/scriptorium-wasm-browser-parity.js"
      - "scripts/tests/lib/parser-oracle-corpus.js"
      - "scripts/tests/rust-content-ast-oracle.js"
      - "scripts/generate-content-ast.js"
      - "scripts/generate-search-index.js"
      - "data/essays.json"
      - "data/compiled/**"
      - "data/search-index.json"
      - "raw/**"
      - ".github/workflows/scriptorium-rust-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native parser oracle across OS × toolchain (cross-platform + toolchain
  # determinism: the same source must byte-match the JS authority everywhere).
  native-parser:
    name: parser ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, beta]
    env:
      SCRIPTORIUM_FUZZ: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rust
      - run: npm run oracle:rust

  # All wasm-backed oracles (parser / json / render / consume) across OS — the
  # artifact the browser loads, byte-identical everywhere.
  wasm-oracles:
    name: wasm oracles ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SCRIPTORIUM_FUZZ: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-wasm-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rust-wasm
      - run: npm run oracle:rust-wasm
      - run: npm run oracle:rust-json
      - run: npm run oracle:rust-render
      - run: npm run oracle:rust-consume
      - run: npm run oracle:rust-content-ast

  # Differential server oracle (rust ≡ node) across OS.
  server-oracle:
    name: server ≡ node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-srv-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-srv-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rust-server
      - name: Differential server oracle
        env:
          SCRIPTORIUM_SERVER_BIN: scriptorium/rust/target/release/scriptorium-server
        run: npm run oracle:rust-server

  # End-to-end artifact parity: the native Rust build bins must reproduce the
  # committed data/compiled/*.json + data/search-index.json (JS-generated)
  # byte-for-byte. The wasm oracle proves the content serializer over fuzz; this
  # proves the whole bins (essays.json walk + wrappers + term stats + orphan set)
  # against the real corpus.
  build-artifacts:
    name: rust build bins ≡ committed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ${{ runner.os }}-cast-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cast-cargo-
      - run: npm run build:rust
      - name: Rust content compiler ≡ committed data/compiled/*.json
        run: scriptorium/rust/target/release/scriptorium-content-ast --check
      - name: Rust search index ≡ committed data/search-index.json
        run: scriptorium/rust/target/release/scriptorium-search-index --check

  # Heavy seeded fuzz against every wasm oracle (compute is not a constraint).
  heavy-fuzz:
    name: heavy fuzz (50k)
    runs-on: ubuntu-latest
    env:
      SCRIPTORIUM_FUZZ: "50000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scriptorium/rust/target
          key: ubuntu-wasm-cargo-${{ hashFiles('scriptorium/rust/**/*.rs', 'scriptorium/rust/Cargo.toml') }}
          restore-keys: ubuntu-wasm-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rust-wasm
      - run: npm run oracle:rust-wasm
      - run: npm run oracle:rust-render
      - run: npm run oracle:rust-consume
      - run: npm run oracle:rust-json
      - run: npm run oracle:rust-content-ast

  # In-browser parity across all three Playwright engines.
  browser-parity:
    name: browser parity ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      RENAISSANCE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run wasm:editor
      - run: npm run ci:scriptorium-parity

  # Rust hygiene — informative only (style is not a deterministic gate).
  hygiene:
    name: rust hygiene (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --manifest-path scriptorium/rust/Cargo.toml --all -- --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --manifest-path scriptorium/rust/Cargo.toml --all-targets
      - name: cargo test
        continue-on-error: true
        run: cargo test --manifest-path scriptorium/rust/Cargo.toml

  # wasm artifact size report — informative.
  wasm-size:
    name: wasm size (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm run build:rust-wasm
      - name: Report .wasm size
        run: |
          f=scriptorium/rust/target/wasm32-unknown-unknown/release/scriptorium_parser.wasm
          ls -la "$f"
          echo "wasm size: $(wc -c < "$f") bytes"
